<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TapMS Ultra</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-auth-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; background-color: #f8fafc; }
        .active-tab { background: #2563eb; color: white; }
        .dot-connected { background: #10b981; }
        .tap-feedback { transform: scale(0.95); transition: transform 0.1s; }
    </style>
</head>
<body class="overflow-x-hidden pb-24">

    <header class="sticky top-0 z-40 bg-white/80 backdrop-blur-md border-b border-slate-100 px-6 py-4 flex justify-between items-center">
        <div class="flex items-center gap-3">
            <div id="status-dot" class="w-3 h-3 rounded-full bg-slate-200"></div>
            <h1 class="font-black text-xl tracking-tighter">Tap<span class="text-blue-600">MS</span></h1>
        </div>
        <div class="flex items-center gap-2">
            <button onclick="toggleSearch()" class="p-2 bg-slate-50 rounded-xl"><i data-lucide="search" class="w-5 h-5"></i></button>
            <button onclick="openBackupModal()" class="p-2 bg-slate-50 rounded-xl"><i data-lucide="database" class="w-5 h-5"></i></button>
        </div>
    </header>

    <div id="search-container" class="hidden px-6 py-3 bg-white border-b border-slate-100">
        <input type="text" id="cashier-search" oninput="filterProducts(this.value)" placeholder="Search..." class="w-full bg-slate-50 rounded-2xl px-5 py-3 text-sm font-bold outline-none">
    </div>

    <div id="cat-bar" class="flex gap-2 overflow-x-auto px-6 py-4 no-scrollbar"></div>

    <main id="view-cashier" class="px-6 grid grid-cols-4 gap-2"></main>

    <main id="view-manage" class="hidden px-6 space-y-6">
        <div class="flex gap-2 bg-slate-100 p-1.5 rounded-[2rem]">
            <button id="sub-btn-orders" onclick="toggleManageSection('orders')" class="flex-1 py-3 rounded-[1.5rem] text-xs font-black uppercase">Orders</button>
            <button id="sub-btn-stock" onclick="toggleManageSection('stock')" class="flex-1 py-3 rounded-[1.5rem] text-xs font-black uppercase">Stock</button>
        </div>
        <section id="sec-orders" class="space-y-4">
            <div id="pending-list"></div>
            <div id="history-list"></div>
        </section>
        <section id="sec-stock" class="hidden space-y-4">
            <button onclick="addItem()" class="bg-blue-600 text-white px-6 py-3 rounded-2xl font-black text-[10px] uppercase">+ Add Product</button>
            <div id="inventory-list" class="space-y-3"></div>
        </section>
    </main>

    <nav class="fixed bottom-6 left-6 right-6 bg-white/90 backdrop-blur-xl border border-slate-100 rounded-[2.5rem] shadow-2xl z-40 flex justify-around items-center p-2">
        <button id="btn-cashier" onclick="showView('cashier')" class="active-tab flex flex-col items-center p-3 rounded-3xl"><i data-lucide="layout-grid" class="w-6 h-6"></i></button>
        <button onclick="openCart()" class="bg-slate-900 text-white p-5 rounded-[2rem] -mt-8"><i data-lucide="shopping-bag" class="w-6 h-6"></i></button>
        <button id="btn-manage" onclick="showView('manage')" class="text-slate-400 flex flex-col items-center p-3 rounded-3xl"><i data-lucide="settings-2" class="w-6 h-6"></i></button>
    </nav>

    <script src="script.js"></script>
</body>
</html>
